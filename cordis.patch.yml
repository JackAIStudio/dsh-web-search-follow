# Replace the shipped DeepSeek-official search backend with follow-search.
# Whole-config replacement of the `web` row restates fetchProvider, so fetch
# also goes through follow-search: it forwards every non-WorkBuddy model to the
# `http` provider still mounted below, and WorkBuddy models to their hosted reader.
- insert:
    - id: web-search-follow
      name: dsh-web-search-follow

- id: web
  config:
    searchProvider: follow-search
    fetchProvider: follow-search

- id: web-search-deepseek
  disabled: true
